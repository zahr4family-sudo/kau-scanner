<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAU Admin Panel</title><style>body{font:15px system-ui;background:#f1f5f9;color:#0f172a;margin:0;padding:20px}main{max-width:1200px;margin:auto}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:12px 0}button{padding:8px 12px;border:0;border-radius:7px;background:#1d4ed8;color:white;cursor:pointer;margin:3px}button.danger{background:#b91c1c}button.gray{background:#475569}input{padding:8px;border:1px solid #cbd5e1;border-radius:6px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:9px;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0} .table{overflow:auto;max-height:75vh}#usersPanel[hidden],#loginPanel[hidden]{display:none}.promobanner{background:#dcfce7;border:1px solid #16a34a}small{color:#64748b}</style></head><body><main><h1>Panel Admin KAU</h1><div class="card" id="loginPanel"><h3>Login Admin</h3><input id="adminPassword" type="password" placeholder="ADMIN_PASSWORD"><button onclick="login()">Login</button><p id="status"></p></div><section id="usersPanel" hidden><div class="card promobanner"><h2 id="modeText">Mode...</h2><button onclick="togglePromo(true)">Aktifkan Mode Promosi (Bebaskan Semua Akses & Perangkat)</button><button class="gray" onclick="togglePromo(false)">Kembalikan ke Mode Pembatasan Normal</button></div><div class="card"><input id="search" placeholder="Cari nama, sekolah, Gmail..." oninput="filterUsers()"><button onclick="loadUsers()">Refresh</button><div class="table"><table><thead><tr><th>Profil</th><th>Status</th><th>Penggunaan</th><th>Kontrol</th></tr></thead><tbody id="userRows"></tbody></table></div></div></section></main><script>
let token='',allUsers=[];const statusEl=document.getElementById('status');async function api(action,data={}){const r=await fetch('/api/admin?action='+encodeURIComponent(action),{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'API error');return d}
async function login(){try{const r=await fetch('/api/admin?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPassword').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;document.getElementById('loginPanel').hidden=true;document.getElementById('usersPanel').hidden=false;await loadUsers()}catch(e){statusEl.textContent=e.message}}
async function loadUsers(){try{const d=await api('users');allUsers=d.users;document.getElementById('modeText').textContent=d.promotionMode?'🟢 MODE PROMOSI AKTIF — UNLIMITED':'🔒 MODE NORMAL — Pembatasan kuota aktif';filterUsers()}catch(e){alert(e.message)}}
function filterUsers(){const q=document.getElementById('search').value.toLowerCase();const list=allUsers.filter(u=>(u.teacher_name+' '+u.school+' '+u.email+' '+u.whatsapp).toLowerCase().includes(q));document.getElementById('userRows').innerHTML=list.map(u=>{const qq=u.quotas,cl=u.vip?'UNLIMITED':`${u.classes_used}/${qq.classes}`,sb=u.vip?'UNLIMITED':`${u.subjects_used}/${qq.subjects}`,dv=u.vip?'UNLIMITED':`${u.devices}/${qq.devices}`;return `<tr><td><b>${esc(u.teacher_name)}</b><br>${esc(u.school)}<br>${u.teacher_type==='PAI'?'Guru PAI • '+esc(u.level||''):'Guru Non-PAI'}<br>${esc(u.email)}<br>WA ${esc(u.whatsapp)}</td><td>${u.verified?'Terverifikasi':'Belum verifikasi'}<br><b>${u.status}</b><br>${u.vip?'VIP / UNLIMITED':''}</td><td>Kelas: ${cl}<br>Mapel: ${sb}<br>Perangkat: ${dv}</td><td><button onclick="userAction('${u.id}','vip',${!u.vip})">${u.vip?'Kembalikan Batas Normal':'Bebaskan Akses User Ini (VIP)'}</button><button class="gray" onclick="userAction('${u.id}','reset-devices')">Reset Perangkat</button><button class="gray" onclick="quotaEdit('${u.id}')">Edit Kuota Manual</button><button class="${u.status==='ACTIVE'?'danger':'gray'}" onclick="userAction('${u.id}','block',${u.status==='ACTIVE'})">${u.status==='ACTIVE'?'Blokir':'Aktifkan'}</button></td></tr>`}).join('')}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function togglePromo(enabled){if(!confirm(enabled?'Aktifkan akses unlimited untuk semua user?':'Kembali ke kuota normal seluruh user?'))return;try{await api('promotion',{enabled});await loadUsers()}catch(e){alert(e.message)}}
async function userAction(userId,op,enabled){if(op==='reset-devices'&&!confirm('Hapus semua device fingerprint user ini?'))return;try{await api('user',{userId,op,enabled});await loadUsers()}catch(e){alert(e.message)}}
async function quotaEdit(userId){const c=prompt('Kuota kelas (angka atau kosong = default):'),s=prompt('Kuota mapel (angka atau kosong = default):'),d=prompt('Kuota perangkat (angka atau kosong = default):');if(c===null||s===null||d===null)return;const cv=c.trim()===''?null:Number(c),sv=s.trim()===''?null:Number(s),dv=d.trim()===''?null:Number(d);if([cv,sv,dv].some(v=>v!==null&&(!Number.isInteger(v)||v<0))){alert('Isi angka bulat >=0 atau kosong.');return}try{await api('user',{userId,op:'quota',class_quota:cv,subject_quota:sv,device_quota:dv});await loadUsers()}catch(e){alert(e.message)}}
</script></body></html>
